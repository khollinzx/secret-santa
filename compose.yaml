name: secret-santa
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-secret_santa}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  api:
    build: {context: ., target: api}
    environment:
      DATABASE_SSL: disable
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-secret_santa}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-http://localhost:3001}
      PORT: 4000
    ports: ["127.0.0.1:4000:4000"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
  participant:
    build:
      context: .
      target: participant
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_PARTICIPANT_URL: ${WEB_ORIGIN:-http://localhost:3000}
        NEXT_PUBLIC_ADMIN_URL: ${ADMIN_ORIGIN:-http://localhost:3001}
    ports: ["127.0.0.1:3000:80"]
    depends_on: [api]
    restart: unless-stopped
  admin:
    build:
      context: .
      target: admin
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_PARTICIPANT_URL: ${WEB_ORIGIN:-http://localhost:3000}
        NEXT_PUBLIC_ADMIN_URL: ${ADMIN_ORIGIN:-http://localhost:3001}
    ports: ["127.0.0.1:3001:80"]
    depends_on: [api]
    restart: unless-stopped
  admin-bootstrap:
    profiles: [bootstrap]
    build: {context: ., target: api}
    command: ["node", "apps/api/dist/seed-admin.js"]
    environment:
      DATABASE_SSL: disable
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-secret_santa}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_TOTP_SECRET: ${ADMIN_TOTP_SECRET}
    depends_on:
      postgres: {condition: service_healthy}
  worker:
    profiles: [email]
    build: {context: ., target: api}
    command: ["node", "apps/api/dist/worker.js"]
    environment:
      DATABASE_SSL: disable
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-secret_santa}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
volumes:
  postgres_data:
