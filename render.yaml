# Supabase PostgreSQL project: twydcpdjkwxgwapqsedm
# Reuse the existing Secret Santa API; no paid Render database or disk.
services:
- type: web
  name: secret-santa
  runtime: node
  plan: free
  region: oregon
  buildCommand: npm ci --include=dev && npm run build:api
  startCommand: node scripts/migrate-postgres.mjs && node apps/api/dist/main.js
  healthCheckPath: /health
  autoDeployTrigger: 'off'
  envVars:
  - key: NODE_VERSION
    value: '22'
  - key: NODE_ENV
    value: production
  - key: PUBLIC_WEB_HOST
    fromService:
      type: web
      name: secret-santa-web
      envVarKey: RENDER_EXTERNAL_HOSTNAME
  - key: PUBLIC_ADMIN_HOST
    fromService:
      type: web
      name: secret-santa-admin
      envVarKey: RENDER_EXTERNAL_HOSTNAME
  - key: DATABASE_URL
    sync: false
- type: web
  name: secret-santa-web
  runtime: static
  buildCommand: npm ci --include=dev && node scripts/render-build.mjs participant
  staticPublishPath: ./out
  autoDeployTrigger: 'off'
  envVars:
  - key: NODE_VERSION
    value: '22'
  - key: PUBLIC_API_HOST
    fromService:
      type: web
      name: secret-santa
      envVarKey: RENDER_EXTERNAL_HOSTNAME
  - key: PUBLIC_WEB_HOST
    fromService:
      type: web
      name: secret-santa-web
      envVarKey: RENDER_EXTERNAL_HOSTNAME
  - key: PUBLIC_ADMIN_HOST
    fromService:
      type: web
      name: secret-santa-admin
      envVarKey: RENDER_EXTERNAL_HOSTNAME
  headers:
  - path: /*
    name: X-Content-Type-Options
    value: nosniff
  - path: /*
    name: X-Frame-Options
    value: DENY
- type: web
  name: secret-santa-admin
  runtime: static
  buildCommand: npm ci --include=dev && node scripts/render-build.mjs admin
  staticPublishPath: ./apps/admin/out
  autoDeployTrigger: 'off'
  envVars:
  - key: NODE_VERSION
    value: '22'
  - key: PUBLIC_API_HOST
    fromService:
      type: web
      name: secret-santa
      envVarKey: RENDER_EXTERNAL_HOSTNAME
  - key: PUBLIC_WEB_HOST
    fromService:
      type: web
      name: secret-santa-web
      envVarKey: RENDER_EXTERNAL_HOSTNAME
  - key: PUBLIC_ADMIN_HOST
    fromService:
      type: web
      name: secret-santa-admin
      envVarKey: RENDER_EXTERNAL_HOSTNAME
  headers:
  - path: /*
    name: X-Content-Type-Options
    value: nosniff
  - path: /*
    name: X-Frame-Options
    value: DENY
